<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Pet Rock & Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-ui">
    <h3 id="moneydisp">Money: 5💵</h3>
    <input type="text" id="name" placeholder="Give your rock a name...">
    <div class="main-buttons">
      <button type="button" id="s">🛒 Shop</button>
      <button type="button" id="chat">CHAT WITH Unnamed Rock</button>
      <button type="button" id="outfit-btn">👔 My Outfits</button>
      <button type="button" id="surgery-btn">🗿 Stone Body Shop</button>
    </div>
  </div>

  <div class="control-panel">
    <button type="button" id="stop-drag">Stop DRAGGING</button>
    <button type="button" id="clear-menu-btn">🧹 Clear Menu</button>
    <button type="button" id="unclear-btn">✨ Unclear Buttons</button>
    <button type="button" id="custom-item-btn">🎨 Custom Item</button>
    <button type="button" id="code">Code🐦</button>
  </div>

  <div id="clear-overlay" class="overlay">
    <div class="overlay-content">
      <h1>What do you want to clear?</h1>
      <button id="clear-items-btn">🗑️ Clear All Items</button>
      <button id="clear-ui-btn">🚫 Clear All Buttons</button>
      <button id="close-clear">Cancel</button>
    </div>
  </div>

  <div id="custom-overlay" class="overlay">
    <div class="overlay-content">
      <h2>Create Custom Item</h2>
      <input type="text" id="custom-name" placeholder="Item Name...">
      <p>Upload Image:</p>
      <input type="file" id="custom-file" accept="image/*">
      <div id="custom-btn-group">
        <button id="confirm-custom">Confirm (100💵)</button>
        <button id="close-custom">Cancel</button>
      </div>
    </div>
  </div>

  <div id="outfit-overlay" class="overlay">
    <div class="overlay-content">
      <h1>My Saved Outfits</h1>
      <button id="save-current-outfit">+ Save Current Outfit</button>
      <div id="outfit-list" class="outfit-list"></div>
      <button id="close-outfit">Close</button>
    </div>
  </div>

  <div id="surgery-overlay" class="overlay">
    <div class="overlay-content">
      <h2>Stone Plastic Surgery 💉</h2>
      <div id="surgery-grid">
        <button id="btn-red">Red (50💵)</button>
        <button id="btn-blue">Blue (100💵)</button>
        <button id="btn-yellow">Yellow (100💵)</button>
        <button id="btn-rainbow">Rainbow (350💵)</button>
        <button id="btn-hardy">Hardy (50)</button>
        <button id="btn-devils">Devils (100)</button>
        <button id="btn-normal">Normal (0)</button>
        <button id="btn-golden">Golden (10.000)</button>
        <button id="btn-money">Money (50.000)</button>
      </div>
      <button id="close-surgery">Cancel</button>
    </div>
  </div>

  <div id="coverlay" class="overlay">
    <div class="overlay-content">
      <button type="button" id="xbu">×</button>
      <h1>🪨+y+⭐</h1>
      <h1 style="font-size: 50px;">Input code</h1>
      <input type="text" id="codin">
    </div>
  </div>

  <div class="screen-overlay" id="overlay">
    <div class="content">
      <h1>Rock Needs Shop 🛒</h1>
      
      <div class="shop-row">
        <div class="item-group"><img src="eye1.png"><button id="e1" data-p="20">BUY (20)</button></div>
        <div class="item-group"><img src="eye2.png"><button id="e2" data-p="30">BUY (30)</button></div>
        <div class="item-group"><img src="eye3.png"><button id="e3" data-p="40">BUY (40)</button></div>
      </div>

      <div class="shop-row">
        <div class="item-group"><img src="balcap.png"><button id="h1" data-p="20">BUY (20)</button></div>
        <div class="item-group"><img src="top.png"><button id="h2" data-p="30">BUY (30)</button></div>
        <div class="item-group"><img src="moustache.png"><button id="h3" data-p="40">BUY (40)</button></div>
      </div>

      <h3 style="margin-top:30px;">Custom Items</h3>
      <div id="custom-shop-container"></div>

      <button id="close-btn">Close Shop</button>
    </div>
  </div>

  <div id="chat-overlay" class="overlay">
    <div class="app-container">
      <div class="header">
          <button id="close-chat">&times;</button>
          <div class="avatar-info">
              <div class="avatar"></div>
              <div class="status-dot"></div>
              <div>
                  <h4 id="chat-header-name">Unnamed Rock</h4>
                  <p class="status-text">Active right now</p>
              </div>
          </div>
      </div>
      <div id="chat-window"></div>
      <div class="input-area">
          <input type="text" id="user-input" placeholder="Type something..." autocomplete="off">
          <button class="send-btn" onclick="prosesChat()">Send</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
