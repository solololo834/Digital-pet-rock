<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Pet Rock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <button type="button" id="s">🛒 Shop</button>
  <h3 id="moneydisp">Money: 5💵</h3>
  <input type="text" id="name" placeholder="Give your rock a name...">
  <button type="button" id="chat">CHAT WITH Unamed rock</button>
  <button type="button" id="stop-drag">Stop DRAGGING</button>
<button type="button" id="outfit-btn">👔 My Outfits</button>

<button type="button" id="clear-menu-btn" style="position: fixed; top: 500px; left: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; background-color: #6c5ce7; color: white; border: none; z-index: 3;">🧹 Clear Menu</button>

<button type="button" id="unclear-btn" style="position: fixed; top: 20px; left: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; background-color: #00b894; color: white; border: none; z-index: 1000; display: none;">✨ Unclear Buttons</button>

<div id="clear-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.8); z-index: 2002; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
  <h1 style="color: white;">What do you want to clear?</h1>
  <button id="clear-items-btn" style="padding: 15px 30px; background: #ff4c4c; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold;">🗑️ Clear All Items</button>
  <button id="clear-ui-btn" style="padding: 15px 30px; background: #fdcb6e; color: black; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold;">🚫 Clear All Buttons</button>
  <button id="close-clear" style="margin-top: 20px; color: white; background: none; border: 1px solid white; padding: 5px 15px; cursor: pointer;">Cancel</button>
</div>

<button type="button" id="custom-item-btn" style="position: fixed; top: 550px; left: 200px; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; background-color: #0984e3; color: white; border: none; z-index: 3;">🎨 Custom Item</button>

<div id="custom-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.85); z-index: 2005; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; gap: 15px;">
    <h2>Create Custom Item</h2>
    <input type="text" id="custom-name" placeholder="Item Name..." style="padding: 10px; border-radius: 5px; border: none; width: 250px;">
    <p>Upload Image:</p>
    <input type="file" id="custom-file" accept="image/*" style="color: white;">
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="confirm-custom" style="padding: 10px 20px; background: #42b72a; color: white; border: none; border-radius: 5px; cursor: pointer;">Confirm (100💵)</button>
        <button id="close-custom" style="padding: 10px 20px; background: #ff4c4c; color: white; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
    </div>
</div>

<div id="outfit-overlay">
  <h1>My Saved Outfits</h1>
  <button id="save-current-outfit" style="padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer;">
    + Save Current Outfit
  </button>
  <div class="outfit-list" id="outfit-list">
    </div>
  <button id="close-outfit" style="margin-top: 30px; padding: 10px 40px; background: #ff4c4c; color: white; border: none; border-radius: 5px; cursor: pointer;">
    Close
  </button>
</div>

<button type="button" id="surgery-btn" style="position: fixed; top: 450px; left: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; background-color: #a29bfe; color: white; border: none; z-index: 3;">🗿 Stone plastic surgery</button>

<div id="surgery-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.85); z-index: 2010; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; gap: 20px;">
  <h2>Stone Plastic Surgery 💉</h2>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
    <button id="btn-red" style="padding: 15px; background: #ff4757; color: white; border: none; border-radius: 8px; cursor: pointer;">Red (50💵)</button>
    <button id="btn-blue" style="padding: 15px; background: #2e86de; color: white; border: none; border-radius: 8px; cursor: pointer;">Blue (100💵)</button>
    <button id="btn-yellow" style="padding: 15px; background: #f1c40f; color: black; border: none; border-radius: 8px; cursor: pointer;">Yellow (100💵)</button>
    <button id="btn-rainbow" style="padding: 15px; background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); color: white; border: none; border-radius: 8px; cursor: pointer;">Rainbow (350💵)</button>
    <button id="btn-hardy" style="padding: 15px; background: #747d8c; color: white; border: none; border-radius: 8px; cursor: pointer;">Hardy(50)</button>
    <button id="btn-devils" style="padding: 15px; background: #2f3542; color: #ff4757; border: none; border-radius: 8px; cursor: pointer;">Devils(100)</button>
    <button id="btn-normal" style="padding: 15px; background: #747d8c; color: white; border: none; border-radius: 8px; cursor: pointer;">Normal(0)</button>
  </div>
  <button id="close-surgery" style="margin-top: 20px; padding: 10px 30px; background: none; border: 1px solid white; color: white; cursor: pointer; border-radius: 5px;">Cancel</button>
</div>

  <div class="screen-overlay" id="overlay">
    <div class="content">
      <h1>Rock Needs Shop 🛒</h1>
      <div id="img">
        <img src="eye1.png" />
        <img src="eye2.png" />
        <img src="eye3.png" />
      </div>
      <div id="buy">
        <button id="e1" data-p="20">BUY (20)</button>
        <button id="e2" data-p="30">BUY (30)</button>
        <button id="e3" data-p="40">BUY (40)</button>
      </div>
      <div id="img2">
        <img src="balcap.png" />
        <img src="top.png" />
        <img src="moustache.png" />
      </div>
      <div id="buy2">
        <button id="h1" data-p="20">BUY (20)</button>
        <button id="h2" data-p="30">BUY (30)</button>
        <button id="h3" data-p="40">BUY (40)</button>
      </div>
      <div id="img3">
        <img src="pirate.png" />
        <img src="chef.png" />
        <img src="builderhat.png" />
      </div>
      <div id="buy3">
        <button id="h4" data-p="20">BUY (20)</button>
        <button id="h5" data-p="30">BUY (30)</button>
        <button id="h6" data-p="40">BUY (40)</button>
      </div>
      <div id="img4">
        <img src="mouth.png" />
        <img src="smile.png" />
        <img src="default.png" />
      </div>
      <div id="buy4">
        <button id="m1" data-p="10">BUY (10)</button>
        <button id="m2" data-p="30">BUY (30)</button>
        <button id="m3" data-p="20">BUY (20)</button>
      </div>
      <h3 style="margin-top:30px;">Custom Items</h3>
<div id="custom-shop-container" style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 50px;">
    </div>

      <button id="close-btn">Close</button>
    </div>
  </div>

  <div id="chat-overlay">
    <div class="app-container">
      <button id="close-chat">&times;</button>
      <div class="header">
          <div style="position: relative;">
              <div class="avatar"></div>
              <div class="status-dot"></div>
          </div>
          <div>
              <h4 id="chat-header-name" style="margin:0; font-size: 16px; color: black;">unamed rock</h4>
              <p style="margin:0; font-size: 12px; color: #65676b;">Active right now</p>
          </div>
      </div>

      <div id="chat-window">
      </div>

      <div class="input-area">
          <input type="text" id="user-input" placeholder="Type something..." autocomplete="off">
          <button class="send-btn" onclick="prosesChat()">Send</button>
      </div>
    </div>
  </div>

  <script src="index.js">
  </script>
</body>
</html>
